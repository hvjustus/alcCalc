<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<link rel="stylesheet" href="./index.css" />
		<script type="module" src="./index.js"></script>
		<script type="module" src="./theme.js"></script>

		<title>AlcCalc</title>
	</head>
	<body>
		<i id="theme-toggle" class="icon-dark-mode"></i>
		<header>
			<h1>AlcCalc</h1>
			<h2>Descubra a forma mais barata de <strong>ficar bêbado mais rápido</strong>.</h2>
		</header>

		<main>
			<form>
				<input required type="text" id="inputName" placeholder="Nome" />
				<input required type="number" step="0.01" id="inputPrice" placeholder="Preço (R$)" />
				<div>
					<input required type="number" id="inputQuantity" placeholder="Quantidade" />
					<select id="inputUnit">
						<option value="liters">L</option>
						<option value="milliliters">mL</option>
					</select>
				</div>
				<input required type="number" step="0.1" id="inputAbv" placeholder="ABV (%)" />
				<button type="submit">Adicionar</button>
			</form>

			<table>
				<thead>
					<th>Nome</th>
					<th id="price">Preço</th>
					<th id="quantity">Quantidade</th>
					<th id="abv">ABV</th>
					<th>mL/R$</th>
				</thead>
				<tbody id="tableBody"></tbody>
			</table>
		</main>
	</body>
</html>
